# CI copies this dir's snap/ to the repo root and sets the version via sed.
name: gitkraft
base: core24
version: '0.0.0'
summary: GitKraft — desktop GUI Git IDE written in Rust
description: |
  Git IDE written entirely in Rust.
license: MIT
grade: stable
confinement: strict
title: GitKraft
icon: assets/icons/gitkraft-512.png

apps:
  gitkraft:
    command: bin/gitkraft
    extensions: [gnome]
    # unity7 lets the tray register as a StatusNotifierItem; desktop-launch stays with the extension.
    plugs: [home, removable-media, network, ssh-keys, unity7]

parts:
  # The gnome extension adds its own parts, and snapcraft then wants rustup from a part we name
  # ("'rustup' not found and part 'gitkraft' does not depend on a part named 'rust-deps'").
  rust-deps:
    plugin: nil
    build-packages:
      - rustup
  gitkraft:
    after: [rust-deps]
    plugin: rust
    source: .
    rust-path: [crates/gitkraft-gui]
    build-packages:
      - pkg-config
      - cmake
      - make
      - perl
      - libssl-dev
      - libxkbcommon-dev
      - libwayland-dev
      - libfontconfig1-dev
      - libgl1-mesa-dev
    stage-packages:
      - libfontconfig1
      - libxkbcommon0
      - libwayland-client0

[package]
name = "gitkraft-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
gitkraft-core = { path = "../crates/gitkraft-core" }
gitkraft-platforms = { path = "../crates/gitkraft-platforms" }
gitkraft-ci = { path = "../crates/gitkraft-ci" }
gitkraft-hub = { path = "../crates/gitkraft-hub" }

# Not part of the main workspace (needs nightly).
[workspace]

[[bin]]
name = "text_utils"
path = "fuzz_targets/text_utils.rs"
test = false
doc = false

[[bin]]
name = "validate_ref_name"
path = "fuzz_targets/validate_ref_name.rs"
test = false
doc = false

[[bin]]
name = "commit_message"
path = "fuzz_targets/commit_message.rs"
test = false
doc = false

[[bin]]
name = "settings_json"
path = "fuzz_targets/settings_json.rs"
test = false
doc = false

[[bin]]
name = "diff_positions"
path = "fuzz_targets/diff_positions.rs"
test = false
doc = false

[[bin]]
name = "ci_log"
path = "fuzz_targets/ci_log.rs"
test = false
doc = false

[[bin]]
name = "markdown_images"
path = "fuzz_targets/markdown_images.rs"
test = false
doc = false

[[bin]]
name = "clone_plan"
path = "fuzz_targets/clone_plan.rs"
test = false
doc = false

[workspace]
members = [
    "crates/gitkraft-core",
    "crates/gitkraft-gui",
    "crates/gitkraft-tui",
]
resolver = "2"

[workspace.package]
version      = "1.2.15"
edition      = "2024"
rust-version = "1.90"
authors      = ["Sorin Irimies <sorinirimies@gmail.com>"]
license      = "MIT"
repository   = "https://github.com/sorinirimies/gitkraft"

# ── Shared dependency versions ─────────────────────────────────────────────────
# Pin versions here once; each crate's Cargo.toml references them with
# `{ workspace = true }` so there is a single source of truth.

[workspace.dependencies]
# Core / shared
git2         = { version = "0.21", features = ["vendored-openssl"] }
anyhow       = "1"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
chrono       = { version = "0.4", features = ["serde"] }
dirs         = "7.0"

notify       = { version = "8.2.1", features = [] }
futures      = "0.3"
tempfile     = "3"
tracing            = "0.1"

# GUI (Iced)
iced         = { version = "0.14", features = ["advanced", "canvas"] }
iced_fonts   = { version = "0.3", features = ["bootstrap"] }
rfd          = "0.17"

# TUI (Ratatui)
arboard              = "3"
ratatui              = "0.30"
crossterm            = "0.29"
tui-file-explorer    = { version = "4", default-features = false }
tui-spinner          = "0.5.1"
tui-skeleton         = "0.3.0"
tui-nuances          = "0.1.10"

# Internal crates
gitkraft-core = { path = "crates/gitkraft-core", version = "1.2.15" }

[workspace.lints.rust]
# libgit2 settings and AppKit need unsafe: each use allows it with a reason.
unsafe_code = "deny"
missing_debug_implementations = "warn"
# `pub` only for what another crate uses; then dead_code finds the rest.
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.dev]
opt-level = 0

[profile.release]
opt-level     = 3
lto           = "thin"   # faster than full LTO, nearly same size reduction
codegen-units = 1        # maximises inlining across crate boundaries
strip         = "symbols" # removes debug symbols from release binary
panic         = "abort"  # removes unwinding tables (~10% smaller binary)

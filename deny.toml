# cargo-deny configuration: `cargo deny check`
[graph]
all-features = true

[advisories]
version = 2
# Documented ignores: no upstream fix available (transitive via git2 / iced).
ignore = [
    "RUSTSEC-2026-0183", # git2 unsound Remote::list(); no fix yet, not reachable from our usage
    "RUSTSEC-2026-0184", # git2 unsound BlameHunk Signature; no fix yet
    "RUSTSEC-2024-0436", # paste unmaintained (transitive via iced/wgpu)
    "RUSTSEC-2026-0192", # ttf-parser unmaintained (transitive via iced/cosmic-text)
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "Unlicense",
    "WTFPL",
    "CC0-1.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

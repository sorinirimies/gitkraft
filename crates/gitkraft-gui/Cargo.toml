[package]
name = "gitkraft"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "GitKraft — Git IDE desktop application (Iced GUI)"
readme = "../../README.md"
categories = ["gui", "development-tools"]
keywords = ["git", "vcs", "ide", "gui"]

[lib]
name = "gitkraft_gui"
path = "src/lib.rs"

[[bin]]
name = "gitkraft"
path = "src/main.rs"

[dependencies]
gitkraft-core = { workspace = true }
dirs = { workspace = true }
gitkraft-hub  = { workspace = true }
gitkraft-ci   = { workspace = true }
gitkraft-settings  = { workspace = true }
gitkraft-platforms = { workspace = true, features = ["desktop"] }
tokio      = { workspace = true }
chrono     = { workspace = true }
tui-spinner   = { workspace = true }
iced       = { workspace = true }
iced_fonts = { workspace = true }
rfd        = { workspace = true }
futures       = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# macOS: winit builds a menu bar with only the application menu, so the system's window
# commands (Minimize, Zoom, Move & Resize / tiling, and the shortcuts that go with them)
# are missing. `src/window/macos.rs` adds the standard Window menu. The same versions winit
# itself uses, so nothing new is compiled.
[target.'cfg(target_os = "macos")'.dependencies]
objc2            = "0.6"
objc2-app-kit    = { version = "0.3", features = ["NSApplication", "NSImage", "NSMenu", "NSMenuItem", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSObject"] }

# Windows: `build.rs` embeds assets/gitkraft.ico into gitkraft.exe (Explorer, shortcuts).
[target.'cfg(windows)'.build-dependencies]
winresource = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
